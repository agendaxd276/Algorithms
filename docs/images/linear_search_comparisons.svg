<rect x="77.7" y="283.5" width="46.9" height="2.5" rx="3" class="s1"/>
<text x="101.1" y="279.5" class="val" text-anchor="middle">1</text>
<rect x="126.6" y="283.5" width="46.9" height="2.5" rx="3" class="s2"/>
<text x="150.0" y="279.5" class="val" text-anchor="middle">1</text>
<rect x="175.4" y="283.5" width="46.9" height="2.5" rx="3" class="s3"/>
