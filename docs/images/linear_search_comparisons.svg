<text x="36.0" y="66.0" class="lab" text-anchor="start">normal</text>
<rect x="81.2" y="57" width="11" height="11" rx="2" class="s2"/>
<text x="97.2" y="66.0" class="lab" text-anchor="start">optimal</text>
<rect x="148.60000000000002" y="57" width="11" height="11" rx="2" class="s3"/>
<text x="164.6" y="66.0" class="lab" text-anchor="start">optimized</text>
<line x1="56" x2="620" y1="286.0" y2="286.0" class="grid"/>
<text x="50.0" y="290.0" class="lab" text-anchor="end">0</text>
<line x1="56" x2="620" y1="235.5" y2="235.5" class="grid"/>
